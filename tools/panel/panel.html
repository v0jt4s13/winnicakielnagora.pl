<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cennik — Winnica Kielna Góra</title>
  <!-- style.css jest tu tylko po to, zeby podglad karty wygladal jak w sklepie.
       Panel ma wlasny, neutralny wyglad w panel.css. -->
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/panel.css">
</head>
<body>
  <header class="pasek">
    <div>
      <h1>Cennik</h1>
      <p class="sciezka" id="sciezka">data/wina.json</p>
    </div>
    <div class="pasek-akcje">
      <span id="stan-zmian" class="stan"></span>
      <button type="button" id="odrzuc" class="przycisk">Odrzuć zmiany</button>
      <button type="button" id="zapisz" class="przycisk glowny">Zapisz</button>
    </div>
  </header>

  <p id="komunikat" class="komunikat" hidden></p>

  <main>
    <section class="sekcja">
      <div class="naglowek-sekcji">
        <h2>Pozycje <span id="licznik" class="licznik"></span></h2>
        <button type="button" id="dodaj" class="przycisk">+ Dodaj pozycję</button>
      </div>
      <ul id="lista" class="lista"></ul>
      <p id="pusto" class="pusto" hidden>Cennik jest pusty. Dodaj pierwszą pozycję.</p>
    </section>

    <section class="sekcja" id="sekcja-formularza" hidden>
      <div class="naglowek-sekcji">
        <h2 id="tytul-formularza">Pozycja</h2>
        <button type="button" id="usun" class="przycisk niebezpieczny">Usuń pozycję</button>
      </div>

      <form id="formularz" class="formularz" autocomplete="off">
        <label>Nazwa
          <input name="nazwa" type="text" required>
        </label>
        <label>Identyfikator
          <input name="id" type="text" required>
          <small>Klucz w koszyku. Małe litery, cyfry i myślnik.</small>
        </label>
        <label>Odmiana
          <select name="odmiana_slug" required></select>
          <small>Strona, do której linkuje karta w sklepie.</small>
        </label>
        <label>Kategoria
          <select name="kategoria" required></select>
        </label>
        <label>Rocznik
          <input name="rocznik" type="number" min="1900" max="2100" step="1">
          <small>Zostaw puste dla soków.</small>
        </label>
        <label>Alkohol (%)
          <input name="alkohol" type="number" min="0" max="25" step="0.1">
          <small>Zostaw puste dla soków.</small>
        </label>
        <label>Pojemność (ml)
          <input name="pojemnosc_ml" type="number" min="1" step="1" required>
        </label>
        <label>Cena brutto (zł)
          <input name="cena_brutto" type="number" min="0.01" step="0.01" required>
          <small>Jedyna zapisywana cena. Netto liczy się samo.</small>
        </label>
        <label>Rabat (%)
          <input name="rabat_procent" type="number" min="0" max="99" step="1" required>
        </label>
        <label>Zdjęcie
          <select name="zdjecie" required></select>
        </label>
        <label class="pole-szerokie">Opis
          <textarea name="opis" rows="3" required></textarea>
        </label>
        <label class="pole-checkbox">
          <input name="dostepne" type="checkbox">
          <span>Dostępne w sklepie</span>
        </label>
      </form>

      <div class="podglad">
        <h3>Tak zobaczy to klient</h3>
        <!-- Renderowane przez Produkty.renderProductCard() — tym samym kodem, co sklep -->
        <div id="podglad-karty" class="podglad-ramka"></div>
      </div>
    </section>

    <section class="sekcja">
      <h2>Kategorie</h2>
      <p class="podpowiedz">Filtr w sklepie buduje swoje opcje z tej listy.</p>
      <ul id="lista-kategorii" class="znaczniki"></ul>
      <div class="dodaj-kategorie">
        <input type="text" id="nowa-kategoria" placeholder="np. Soki">
        <button type="button" id="dodaj-kategorie" class="przycisk">Dodaj kategorię</button>
      </div>
    </section>
  </main>

  <script src="/assets/js/produkty.js"></script>
  <script src="/panel.js"></script>
</body>
</html>
