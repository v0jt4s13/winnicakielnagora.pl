# Standardy tego projektu. Aktualizuj przez /index-standards po ręcznej edycji plików.
#
# Wygenerowane z odczytu kodu (index.html, assets/js/main.js, assets/css/custom.css),
# nie skopiowane z innego projektu.

content:
  html-editing:
    description: Zasady edycji index.html — punktowe zmiany, wcięcia, ikony <symbol>, kotwice zamiast numerów linii
  wina-json:
    description: data/wina.json jako jedyne źródło asortymentu i cen; zapisujemy tylko brutto, resztę wyliczamy

frontend:
  js-conventions:
    description: Konwencje main.js — wzorzec initX() + DOMContentLoaded, qs/qsa, optional chaining, stan w pamięci
  styling:
    description: Bundle Tailwinda tylko do odczytu vs. ręczny custom.css, kolory przez zmienne motywu
  theming:
    description: Trzy motywy w themeStyles, parytet 29 zmiennych CSS, colorScheme, preferencje i niezależny initTimeTheme
